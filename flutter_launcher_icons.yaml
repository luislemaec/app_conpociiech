# Icono de la App: símbolo oficial de CONPOCIIECH (sin texto), generado desde
# assets/branding/logo_conpociiech.png. Tras cambiar las imágenes de branding/, ejecutar:
#   dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  # Icono clásico e iOS: fondo blanco, símbolo centrado con margen.
  image_path: "branding/icono_conpociiech.png"
  # Icono adaptativo (Android 8+): fondo blanco y símbolo dentro de la zona segura.
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "branding/icono_adaptativo_conpociiech.png"
  # iOS no admite transparencia en el icono.
  remove_alpha_ios: true
  min_sdk_android: 21
