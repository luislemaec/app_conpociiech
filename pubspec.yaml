name: app_conpociiech
description: "App institucional CONPOCIIECH"
publish_to: 'none'

# versionName+versionCode (Android) / CFBundleShortVersionString+CFBundleVersion (iOS).
version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  # Estado de la aplicación (sesión, módulos), igual que en asdigital.
  provider: ^6.1.5+1
  # Navegación con guardas: las áreas autenticadas exigen sesión y rol.
  go_router: ^18.0.2
  http: ^1.6.0
  flutter_secure_storage: ^11.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    # Logo provisional del TEC hasta contar con el logo oficial de CONPOCIIECH.
    - assets/branding/

  # Tipografía institucional del Tribunal (Montserrat, licencia OFL en assets/fonts/OFL.txt).
  # Pesos del estándar: 400 texto, 500 énfasis, 700 énfasis fuerte (sin Light en tamaños pequeños).
  fonts:
    - family: Montserrat
      fonts:
        - asset: assets/fonts/Montserrat-Regular.ttf
          weight: 400
        - asset: assets/fonts/Montserrat-Medium.ttf
          weight: 500
        - asset: assets/fonts/Montserrat-Bold.ttf
          weight: 700
